name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed boundaries
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.paths.outputs.android }}
      rust: ${{ steps.paths.outputs.rust }}
      go: ${{ steps.paths.outputs.go }}
      contract: ${{ steps.paths.outputs.contract }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            printf '%s\0' '.github/workflows/ci.yml' |
              bash .github/scripts/detect-ci-changes.sh >> "$GITHUB_OUTPUT"
          else
            git diff --name-only -z "$base" "$HEAD_SHA" |
              bash .github/scripts/detect-ci-changes.sh >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Android baseline
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build Android root
        shell: bash
        run: bash apps/android/gradlew -p apps/android build --no-daemon

  rust:
    name: Rust baseline
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Build Rust workspace
        run: cargo build --workspace --locked

  go:
    name: Go baseline
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/vision-api/go.mod
          cache: false

      - name: Build Go module
        run: go -C services/vision-api build ./...

  contract:
    name: Contract baseline
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check contract layout
        shell: bash
        run: |
          set -euo pipefail
          test -d api/schemas
          test -d fixtures/baseline
          test -d fixtures/compare
          test -d fixtures/verify

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - android
      - rust
      - go
      - contract
    runs-on: ubuntu-latest
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      ANDROID_RESULT: ${{ needs.android.result }}
      RUST_RESULT: ${{ needs.rust.result }}
      GO_RESULT: ${{ needs.go.result }}
      CONTRACT_RESULT: ${{ needs.contract.result }}
    steps:
      - name: Require successful applicable checks
        shell: bash
        run: |
          set -euo pipefail
          for result in \
            "$CHANGES_RESULT" \
            "$ANDROID_RESULT" \
            "$RUST_RESULT" \
            "$GO_RESULT" \
            "$CONTRACT_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
