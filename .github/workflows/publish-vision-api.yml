name: Publish and deploy Vision API

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: GitHub Environment receiving the image
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-vision-api-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  publish:
    name: Deploy ${{ inputs.target_environment }} Vision API
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      AR_REPOSITORY: ${{ vars.AR_REPOSITORY }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      VLM_MODEL_ID: ${{ vars.VLM_MODEL_ID }}
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.image.outputs.digest }}
      revision: ${{ steps.deploy.outputs.revision }}
      service_url: ${{ steps.deploy.outputs.service_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate environment configuration
        run: bash .github/scripts/validate-cloud-environment.sh

      - name: Authenticate with Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          cleanup_credentials: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Artifact Registry authentication
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker \
            "$GCP_REGION-docker.pkg.dev" \
            --quiet

      - name: Build and push image
        id: image
        shell: bash
        run: |
          set -euo pipefail

          repository="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$AR_REPOSITORY"
          tagged_image="$repository/vision-api:$GITHUB_SHA"

          docker build \
            --file services/vision-api/Dockerfile \
            --tag "$tagged_image" \
            .
          docker push "$tagged_image"

          digest="$(
            gcloud artifacts docker images describe "$tagged_image" \
              --project "$GCP_PROJECT_ID" \
              --format 'value(image_summary.digest)'
          )"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]

          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'image=%s@%s\n' \
            "$repository/vision-api" \
            "$digest" >> "$GITHUB_OUTPUT"

      - name: Deploy selected environment revision
        id: deploy
        shell: bash
        env:
          APP_ENV: ${{ inputs.target_environment }}
          IMAGE_BY_DIGEST: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          [[ "$APP_ENV" =~ ^(staging|production)$ ]]
          [[ "$IMAGE_BY_DIGEST" =~ @sha256:[a-f0-9]{64}$ ]]

          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "$IMAGE_BY_DIGEST" \
            --platform managed \
            --port 8080 \
            --cpu 1 \
            --memory 512Mi \
            --concurrency 20 \
            --timeout 60s \
            --min-instances 0 \
            --max-instances 10 \
            --no-allow-unauthenticated \
            --set-env-vars "APP_ENV=$APP_ENV,GOOGLE_CLOUD_PROJECT=$GCP_PROJECT_ID,GOOGLE_CLOUD_LOCATION=$GCP_REGION,VLM_MODEL_ID=$VLM_MODEL_ID" \
            --quiet

          service_url="$(
            gcloud run services describe "$CLOUD_RUN_SERVICE" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --format 'value(status.url)'
          )"
          revision="$(
            gcloud run services describe "$CLOUD_RUN_SERVICE" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --format 'value(status.latestReadyRevisionName)'
          )"
          [[ "$service_url" =~ ^https:// ]]
          [[ "$revision" =~ ^[a-z0-9-]+$ ]]

          deployed_image="$(
            gcloud run revisions describe "$revision" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --format 'value(spec.containers[0].image)'
          )"
          test "$deployed_image" = "$IMAGE_BY_DIGEST"

          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
          printf 'service_url=%s\n' "$service_url" >> "$GITHUB_OUTPUT"

      - name: Record deployment evidence
        shell: bash
        env:
          DEPLOYED_DIGEST: ${{ steps.image.outputs.digest }}
          DEPLOYED_IMAGE: ${{ steps.image.outputs.image }}
          DEPLOYED_REVISION: ${{ steps.deploy.outputs.revision }}
          SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          set -euo pipefail
          {
            echo "## Vision API deployment"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            printf '| Environment | `%s` |\n' "$TARGET_ENVIRONMENT"
            printf '| Project | `%s` |\n' "$GCP_PROJECT_ID"
            printf '| Region | `%s` |\n' "$GCP_REGION"
            printf '| Service | `%s` |\n' "$CLOUD_RUN_SERVICE"
            printf '| Revision | `%s` |\n' "$DEPLOYED_REVISION"
            printf '| Digest | `%s` |\n' "$DEPLOYED_DIGEST"
            printf '| Image | `%s` |\n' "$DEPLOYED_IMAGE"
            printf '| Commit | `%s` |\n' "$GITHUB_SHA"
            printf '| URL | %s |\n' "$SERVICE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
