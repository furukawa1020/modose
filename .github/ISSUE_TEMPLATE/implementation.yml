name: Implementation
description: One mergeable implementation change for MODOSE
title: ""
labels: []
body:
  - type: input
    id: modose_id
    attributes:
      label: MODOSE ID
      description: Use exactly one backlog ID.
      placeholder: M-###
    validations:
      required: true

  - type: input
    id: requirement
    attributes:
      label: Requirement ID
      placeholder: FR-GDE-004 / NFR-SEC-002 / none
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: State one observable result.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use testable checkboxes.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Explicitly list neighboring work that must not enter this PR.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Name blocking MODOSE IDs and PRs.
      placeholder: M-001, PR #12 or none
    validations:
      required: true

  - type: input
    id: base_branch
    attributes:
      label: PR base branch
      description: Use main, or name the parent branch for a stacked PR.
      placeholder: main
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: Risk
      options:
        - low
        - medium
        - high
    validations:
      required: true

  - type: textarea
    id: normal_path
    attributes:
      label: Normal-path test
      description: State the command, fixture, instrumentation run, or document check that proves success.
    validations:
      required: true

  - type: textarea
    id: failure_path
    attributes:
      label: Failure-path test
      description: State the rejection, recovery, rollback, or why failure behavior is not applicable.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Name the safe log excerpt, fixture, screenshot, or recording to attach to the PR.
    validations:
      required: true

  - type: textarea
    id: change_budget
    attributes:
      label: Change budget
      description: Confirm 400 or fewer non-generated changed lines, or explain why the Issue cannot be split.
      placeholder: At or below 400 non-generated changed lines.
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: One Issue equals one PR
          required: true
        - label: One PR changes no more than one user-visible behavior
          required: true
        - label: No unrelated refactor
          required: true
        - label: No untracked TODO or disabled test
          required: true
        - label: No image, object label, prompt, token, or PII in logs
          required: true
        - label: Branch and PR title follow the M-### naming rules
          required: true
